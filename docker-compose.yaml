x-cameras-base: &cameras-base
  build:
    context: .
    dockerfile: docker/Dockerfile.cameras
    args:
      ROS_DISTRO: ${ROS_DISTRO_CAMERAS:-humble}
  network_mode: "host"
  ipc: "host"
  pid: "host"
  privileged: true
  tty: true
  stdin_open: true

  volumes:
    - $HOME/.Xauthority:/root/.Xauthority
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /dev:/dev
  device_cgroup_rules:
    - 'c 81:* rmw'
    - 'c 189:* rmw'
  devices:
    - "/dev/input:/dev/input"
  cap_add:
    - SYS_NICE
  environment:
    - QT_X11_NO_MITSHM=1
    - DISPLAY=$DISPLAY
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
    - RCUTILS_COLORIZED_OUTPUT=1
    - SHELL=/bin/bash
    - CAMERA_NAME=camera
    - CAMERA_NAMESPACE=camera
    - ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-enp0s31f6}
    - SERIAL_NUMBER=$SERIAL_NUMBER
    - RMW=${RMW:-fastdds}
    - ROS_DISTRO=${ROS_DISTRO_CAMERAS:-humble}

x-usb-cameras-base: &usb-cameras-base
  <<: *cameras-base
  build:
    context: .
    dockerfile: docker/Dockerfile.cameras
    args:
      ROS_DISTRO: ${ROS_DISTRO_CAMERAS:-humble}
    target: overlay
  command: >
    bash -c "source /opt/ros/${ROS_DISTRO_CAMERAS:-humble}/setup.bash &&
    RMW=${RMW:-} source src/crisp_controllers_demos/scripts/setup_middleware.sh &&
    ros2 run usb_cam usb_cam_node_exe --ros-args -r __ns:=/${CAMERA_NAMESPACE:-camera} -p pixel_format:='mjpeg2rgb'"


x-realsense-cameras-overlay: &realsense-cameras-overlay
  <<: *cameras-base
  build:
    context: .
    dockerfile: docker/Dockerfile.cameras
    args:
      ROS_DISTRO: ${ROS_DISTRO_CAMERAS:-humble}
    target: overlay
  command: >
    bash -c "source /opt/ros/${ROS_DISTRO_CAMERAS:-humble}/setup.bash &&
    RMW=${RMW:-} source src/crisp_controllers_demos/scripts/setup_middleware.sh &&
    echo 'Using the serial number: ${SERIAL_NUMBER}' &&
    ros2 launch realsense2_camera rs_launch.py camera_name:=\${CAMERA_NAME:-camera} camera_namespace:=\${CAMERA_NAMESPACE:-camera} ${SERIAL_NUMBER:+serial_no:=_${SERIAL_NUMBER}}"

x-base: &base
  image: crisp_controllers_demos:base
  build:
    context: .
    dockerfile: docker/Dockerfile.robots
    args:
      ROS_DISTRO: ${ROS_DISTRO_ROBOTS:-jazzy}
    target: base

  network_mode: host
  ipc: host
  pid: host
  privileged: true

  command: /bin/bash
  tty: true
  stdin_open: true

  volumes:
    - $HOME/.Xauthority:/root/.Xauthority
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /dev:/dev
    - .:/home/ros/ros2_ws/src/crisp_controllers_demos
    - ../crisp_py:/home/ros/ros2_ws/src/crisp_py
  device_cgroup_rules:
    - 'c 81:* rmw'
    - 'c 189:* rmw'
  devices:
    - "/dev/input:/dev/input"
  cap_add:
    - SYS_NICE
  environment:
    QT_X11_NO_MITSHM: 1
    DISPLAY: ${DISPLAY}
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
    RCUTILS_COLORIZED_OUTPUT: 1
    SHELL: /bin/bash
    RMW: ${RMW:-fastdds}
    ROS_NETWORK_INTERFACE: ${ROS_NETWORK_INTERFACE:-enp0s31f6}
    ROS_DISTRO: ${ROS_DISTRO_ROBOTS:-jazzy}
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4

  ulimits:
    rtprio: 99
    rttime: -1
    memlock: 8428281856

x-iiwa-overlay: &iiwa-overlay
  <<: *base
  image: crisp_controllers_demos:iiwa-overlay
  build:
    context: .
    dockerfile: docker/Dockerfile.robots
    args:
      ROS_DISTRO: ${ROS_DISTRO_ROBOTS:-jazzy}
    target: iiwa-overlay

x-kinova-overlay: &kinova-overlay
  <<: *base
  image: crisp_controllers_demos:kinova-overlay
  build:
    context: .
    dockerfile: docker/Dockerfile.robots
    args:
      ROS_DISTRO: ${ROS_DISTRO_ROBOTS:-jazzy}
    target: kinova-overlay

# UR and Franka pin to Humble at both build- and run-time. The runtime
# environment block is redefined (YAML merge does not deep-merge env maps)
# so /ros_entrypoint.sh sources /opt/ros/humble/setup.bash on container start.
x-ur-overlay: &ur-overlay
  <<: *base
  image: crisp_controllers_demos:ur-overlay
  build:
    context: .
    dockerfile: docker/Dockerfile.robots
    args:
      ROS_DISTRO: ${ROS_DISTRO:-humble}
    target: ur-overlay
  environment:
    QT_X11_NO_MITSHM: 1
    DISPLAY: ${DISPLAY}
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
    RCUTILS_COLORIZED_OUTPUT: 1
    SHELL: /bin/bash
    RMW: ${RMW:-cyclone}
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    CYCLONEDDS_URI: file:///home/ros/ros2_ws/src/crisp_controllers_demos/config/cyclone_config.xml
    ROS_NETWORK_INTERFACE: ${ROS_NETWORK_INTERFACE:-enp0s31f6}
    ROS_DISTRO: ${ROS_DISTRO:-humble}
    PYTHONPATH: /home/ros/ros2_ws/src/crisp_py

x-franka: &franka
  <<: *base
  image: crisp_controllers_demos:franka
  build:
    context: .
    dockerfile: docker/Dockerfile.robots
    args:
      ROS_DISTRO: ${ROS_DISTRO:-humble}
    target: franka
  environment:
    QT_X11_NO_MITSHM: 1
    DISPLAY: ${DISPLAY}
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
    RCUTILS_COLORIZED_OUTPUT: 1
    SHELL: /bin/bash
    RMW: ${RMW:-cyclone}
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    CYCLONEDDS_URI: file:///home/ros/ros2_ws/src/crisp_controllers_demos/config/cyclone_config.xml
    ROS_NETWORK_INTERFACE: ${ROS_NETWORK_INTERFACE:-enp0s31f6}
    ROS_DISTRO: ${ROS_DISTRO:-humble}
    # kept for the RMW=fastdds fallback (host networking needs UDPv4-only)
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4

# PATH B (server-9 robot, FR3 system 5.8.0): the franka services run the
# PRESERVED server-9 image (libfranka 0.15.0 / franka_ros2 1.0.0 /
# franka_description 0.4.0), which matches this robot's FCI server version 9.
# The current Dockerfile builds the server-10 stack (libfranka 0.20), which
# CANNOT talk to a server-9 robot, so we do NOT rebuild here.
#   Default image: crisp_controllers_demos:franka-overlay-server9 (tag the
#   old image once: docker tag <old_id> crisp_controllers_demos:franka-overlay-server9)
#   Override with FRANKA_IMAGE=... to use a different build.
# WARNING: do NOT run `docker compose build franka-overlay` / `up --build` on
# these services — it would rebuild the server-10 stack and overwrite the
# preserved server-9 image. Plain `docker compose up` reuses the image and is safe.
x-franka-overlay: &franka-overlay
  <<: *base
  image: ${FRANKA_IMAGE:-crisp_controllers_demos:franka-overlay-server9}
  build:
    context: .
    dockerfile: docker/Dockerfile.robots
    args:
      ROS_DISTRO: ${ROS_DISTRO:-humble}
    target: franka-overlay
  environment:
    QT_X11_NO_MITSHM: 1
    DISPLAY: ${DISPLAY}
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
    RCUTILS_COLORIZED_OUTPUT: 1
    SHELL: /bin/bash
    RMW: ${RMW:-cyclone}
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    CYCLONEDDS_URI: file:///home/ros/ros2_ws/src/crisp_controllers_demos/config/cyclone_config.xml
    ROS_NETWORK_INTERFACE: ${ROS_NETWORK_INTERFACE:-enp0s31f6}
    ROS_DISTRO: ${ROS_DISTRO:-humble}
    # kept for the RMW=fastdds fallback (host networking needs UDPv4-only)
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4


services:
  devcontainer:
    <<: *franka

  # -- Robot related services: --
  franka-overlay:
    <<: *franka-overlay

  iiwa-overlay:
    <<: *iiwa-overlay

  kinova-overlay:
    <<: *kinova-overlay

  ur-overlay:
    <<: *ur-overlay

  launch_zenoh_router:
    <<: *base
    command: >
      bash -lc "source /opt/ros/humble/setup.bash &&
      export RMW_IMPLEMENTATION=rmw_zenoh_cpp &&
      export RUST_LOG=zenoh=info &&
      ros2 doctor -r | grep rmw_zenoh_cpp &&
      ros2 daemon stop && ros2 daemon start &&
      ros2 run rmw_zenoh_cpp rmw_zenohd"


  launch_franka:
    <<: *franka-overlay
    container_name: crisp_controllers_demos_launch_franka
    command: >
      bash -lc "source /opt/ros/humble/setup.bash &&
      cd ~/ros2_ws &&
      colcon build --symlink-install --packages-select crisp_controllers_robot_demos &&
      source install/setup.bash &&
      export ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-enp0s31f6} &&
      RMW=${RMW:-cyclone} source src/crisp_controllers_demos/scripts/setup_middleware.sh &&
      ros2 launch crisp_controllers_robot_demos franka.launch.py
      arm_id:=fr3 use_fake_hardware:=${FRANKA_FAKE_HARDWARE:-false} robot_ip:=${ROBOT_IP:-172.16.0.2} use_rviz:=True"

  # Franka + Robotiq 2F-140 at the flange (replaces the Franka Hand). The
  # gripper needs the USB-to-RS485 device, exposed via the /dev mount.
  launch_franka_gripper:
    <<: *franka-overlay
    # Thin layer with robotiq_controllers (the Robotiq runs on its own
    # controller_manager inside franka.launch.py when use_gripper:=true).
    image: crisp_controllers_demos:franka-robotiq-server9
    build:
      context: .
      dockerfile: docker/Dockerfile.robotiq_server9
    container_name: crisp_controllers_demos_launch_franka_gripper
    command: >
      bash -lc "if [ '${FRANKA_FAKE_HARDWARE:-false}' != 'true' ]; then sudo chmod a+rw ${GRIPPER_COM_PORT:-/dev/ttyUSB0}; fi &&
      source /opt/ros/humble/setup.bash &&
      cd ~/ros2_ws &&
      colcon build --symlink-install --packages-select crisp_controllers_robot_demos &&
      source install/setup.bash &&
      export ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-enp0s31f6} &&
      RMW=${RMW:-cyclone} source src/crisp_controllers_demos/scripts/setup_middleware.sh &&
      ros2 launch crisp_controllers_robot_demos franka.launch.py
      arm_id:=fr3
      use_fake_hardware:=${FRANKA_FAKE_HARDWARE:-false}
      robot_ip:=${ROBOT_IP:-172.16.0.2}
      use_gripper:=true
      load_gripper:=false
      com_port:=${GRIPPER_COM_PORT:-/dev/ttyUSB0}
      use_rviz:=True"

  # Standalone Robotiq 2F-140 on its OWN controller_manager (server-9 stack).
  # Uses a thin layer over franka-overlay-server9 that adds robotiq_controllers
  # (missing from the preserved image). Test the gripper in isolation before
  # integrating with the franka arm. Building this thin layer does NOT touch the
  # franka-overlay-server9 image (different tag / Dockerfile).
  launch_robotiq:
    <<: *franka-overlay
    image: crisp_controllers_demos:franka-robotiq-server9
    build:
      context: .
      dockerfile: docker/Dockerfile.robotiq_server9
    container_name: crisp_controllers_demos_launch_robotiq
    command: >
      bash -lc "if [ '${FRANKA_FAKE_HARDWARE:-false}' != 'true' ]; then sudo chmod a+rw ${GRIPPER_COM_PORT:-/dev/ttyUSB0}; fi &&
      source /opt/ros/humble/setup.bash &&
      cd ~/ros2_ws &&
      colcon build --symlink-install --packages-select crisp_controllers_robot_demos &&
      source install/setup.bash &&
      export ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-enp0s31f6} &&
      RMW=${RMW:-cyclone} source src/crisp_controllers_demos/scripts/setup_middleware.sh &&
      ros2 launch crisp_controllers_robot_demos robotiq_gripper_standalone.launch.py
      com_port:=${GRIPPER_COM_PORT:-/dev/ttyUSB0}
      use_fake_hardware:=${FRANKA_FAKE_HARDWARE:-false}"

  launch_dual_franka:
    <<: *franka-overlay
    container_name: crisp_controllers_demos_launch_dual_franka
    command: >
      bash -lc "source /opt/ros/humble/setup.bash &&
      cd ~/ros2_ws &&
      colcon build --symlink-install --packages-select crisp_controllers_robot_demos &&
      source install/setup.bash &&
      export ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-enp0s31f6} &&
      RMW=${RMW:-cyclone} source src/crisp_controllers_demos/scripts/setup_middleware.sh &&
      ros2 launch crisp_controllers_robot_demos dual_franka.launch.py
      use_fake_hardware:=${FRANKA_FAKE_HARDWARE:-false}
      left_robot_ip:=${LEFT_ROBOT_IP:-172.16.1.2} right_robot_ip:=${RIGHT_ROBOT_IP:-172.16.0.2}"

  launch_ur:
    <<: *ur-overlay
    container_name: crisp_controllers_demos_launch_ur
    command: >
      bash -lc "source /opt/ros/humble/setup.bash &&
      cd ~/ros2_ws &&
      colcon build --symlink-install --packages-select crisp_controllers_robot_demos &&
      source install/setup.bash &&
      export ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-enp0s31f6} &&
      RMW=${RMW:-cyclone} source src/crisp_controllers_demos/scripts/setup_middleware.sh &&
      ros2 launch crisp_controllers_robot_demos ur.launch.py
      ur_type:=${UR_TYPE:-ur5e}
      use_fake_hardware:=${UR_FAKE_HARDWARE:-false}
      robot_ip:=${ROBOT_IP:-192.168.0.10}
      use_rviz:=true"

  # UR + Robotiq 2F-140 gripper. Defaults to ur7e; override with UR_TYPE / ROBOT_IP /
  # UR_COM_PORT. The gripper needs the USB-to-RS485 device, exposed via the /dev mount.
  launch_ur_gripper:
    <<: *ur-overlay
    container_name: crisp_controllers_demos_launch_ur_gripper
    command: >
      bash -lc "if [ '${UR_FAKE_HARDWARE:-false}' != 'true' ]; then sudo chmod a+rw ${UR_COM_PORT:-/dev/ttyUSB0}; fi &&
      source /opt/ros/humble/setup.bash &&
      cd ~/ros2_ws &&
      colcon build --symlink-install --packages-select crisp_controllers_robot_demos &&
      source install/setup.bash &&
      export ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-enp0s31f6} &&
      RMW=${RMW:-cyclone} source src/crisp_controllers_demos/scripts/setup_middleware.sh &&
      ros2 launch crisp_controllers_robot_demos ur.launch.py
      ur_type:=${UR_TYPE:-ur7e}
      use_fake_hardware:=${UR_FAKE_HARDWARE:-false}
      robot_ip:=${ROBOT_IP:-192.168.0.10}
      use_gripper:=true
      com_port:=${UR_COM_PORT:-/dev/ttyUSB0}
      use_rviz:=true"

  launch_kinova:
    <<: *kinova-overlay
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
      source install/setup.bash &&
      export ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-enp0s31f6} &&
      RMW=${RMW:-} source src/crisp_controllers_demos/scripts/setup_middleware.sh &&
      ros2 launch crisp_controllers_robot_demos kinova_gen3.launch.py"

  launch_iiwa:
    <<: *iiwa-overlay
    command: >
      bash -c "source /opt/ros/${ROS_DISTRO_ROBOTS:-jazzy}/setup.bash &&
      source install/setup.bash &&
      export ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-enp0s31f6} &&
      RMW=${RMW:-} source src/crisp_controllers_demos/scripts/setup_middleware.sh &&
      ros2 launch crisp_controllers_robot_demos iiwa.launch.py"

  # -- Camera related services: --
  launch_realsense:
    <<: *realsense-cameras-overlay
    container_name: crisp_controllers_demos_realsense

  launch_realsense_camera_left:
    <<: *realsense-cameras-overlay
    container_name: crisp_controllers_demos_realsense_left
    command: >
      bash -c "source /opt/ros/${ROS_DISTRO_CAMERAS:-humble}/setup.bash &&
      export ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-enp0s31f6} &&
      RMW=${RMW:-} source src/crisp_controllers_demos/scripts/setup_middleware.sh &&
      ros2 launch realsense2_camera rs_launch.py camera_name:=\${CAMERA_NAME:-left_wrist_camera} camera_namespace:=\${CAMERA_NAMESPACE:-left} ${SERIAL_NUMBER:+serial:=_${SERIAL_NUMBER}}"

  launch_realsense_camera_right:
    <<: *realsense-cameras-overlay
    container_name: crisp_controllers_demos_realsense_right
    command: >
      bash -c "source /opt/ros/${ROS_DISTRO_CAMERAS:-humble}/setup.bash &&
      RMW=${RMW:-} source src/crisp_controllers_demos/scripts/setup_middleware.sh &&
      ros2 launch realsense2_camera rs_launch.py camera_name:=\${CAMERA_NAME:-right_wrist_camera} camera_namespace:=\${CAMERA_NAMESPACE:-right}"

  launch_realsense_env_camera:
    <<: *realsense-cameras-overlay
    container_name: crisp_controllers_demos_realsense_env
    # environment:
    #   ROS_NETWORK_INTERFACE: ${ROS_NETWORK_INTERFACE:-lo}
    command: >
      bash -c "source /opt/ros/${ROS_DISTRO_CAMERAS:-humble}/setup.bash &&
      export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp &&
      echo 'Using the serial number: $${SERIAL_NUMBER}' &&
      ros2 launch realsense2_camera rs_launch.py \
      camera_name:='env_cam' \
      camera_namespace:='env' \
      rgb_camera.color_profile:=640x480x15 \
      enable_depth:=false \
      serial_no:=_332322073530"

  launch_realsense_wrist_camera:
    <<: *realsense-cameras-overlay
    container_name: crisp_controllers_demos_realsense_wrist
    # environment:
    #   ROS_NETWORK_INTERFACE: ${ROS_NETWORK_INTERFACE:-lo}
    command: >
      bash -c "source /opt/ros/${ROS_DISTRO_CAMERAS:-humble}/setup.bash &&
      export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp &&
      echo 'Using the serial number: $${SERIAL_NUMBER}' &&
      ros2 launch realsense2_camera rs_launch.py \
      camera_name:='wrist_cam' \
      camera_namespace:='wrist' \
      rgb_camera.color_profile:=640x480x15 \
      enable_depth:=false \
      serial_no:=_218722270823"

  launch_camera:
    <<: *usb-cameras-base
