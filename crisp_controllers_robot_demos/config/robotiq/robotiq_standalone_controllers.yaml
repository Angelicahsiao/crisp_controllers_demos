# Controller manager for the standalone Robotiq 2F-85 (franka's gripper), run in
# the /robotiq_2f85 namespace so it (a) never clashes with franka's
# /controller_manager and (b) publishes on /robotiq_2f85/... to match the
# crisp_gym deploy configs (dric_*_franka.yaml). Param keys are fully qualified
# with the namespace so the controllers actually receive them.
/robotiq_2f85/controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

    robotiq_activation_controller:
      type: robotiq_controllers/RobotiqActivationController

    robotiq_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/robotiq_2f85/robotiq_gripper_controller:
  ros__parameters:
    default: true
    joint: robotiq_85_left_knuckle_joint   # 2F-85 driven joint (not finger_joint, which is the 2F-140's)
    allow_stalling: true

/robotiq_2f85/robotiq_activation_controller:
  ros__parameters:
    default: true

/robotiq_2f85/robotiq_joint_state_broadcaster:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
