# Controller manager for the standalone Robotiq 2F-140 (separate from franka).
# Same controller set and params as the UR integration's robotiq entries, so
# crisp_py's Gripper talks to /robotiq_gripper_controller/gripper_cmd exactly
# as before.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

    robotiq_activation_controller:
      type: robotiq_controllers/RobotiqActivationController

    robotiq_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

robotiq_gripper_controller:
  ros__parameters:
    default: true
    joint: finger_joint
    allow_stalling: true

robotiq_activation_controller:
  ros__parameters:
    default: true

robotiq_joint_state_broadcaster:
  ros__parameters:
    joints:
      - finger_joint
