# Real hardware controller config for UR7e.
# use_gravity_compensation is false because UR firmware's direct_torque()
# applies gravity compensation automatically — enabling it here too would
# double-count gravity and destabilize the robot.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 500  # Hz — matches UR RTDE cycle

      joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      twist_broadcaster:
        type: crisp_controllers/TwistBroadcaster

      pose_broadcaster:
        type: crisp_controllers/PoseBroadcaster

      gravity_compensation:
        type: crisp_controllers/CartesianController

      cartesian_impedance_controller:
        type: crisp_controllers/CartesianController

      joint_impedance_controller:
        type: crisp_controllers/CartesianController

      forward_effort_controller:
        type: effort_controllers/JointGroupEffortController

      freedrive_mode_controller:
        type: ur_controllers/FreedriveModeController

  joint_trajectory_controller:
    ros__parameters:
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint

  joint_state_broadcaster:
    ros__parameters:
      use_local_topics: False

  twist_broadcaster:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      end_effector_frame: tool0
      base_frame: base_link

  pose_broadcaster:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      end_effector_frame: tool0
      base_frame: base_link

  # Gravity compensation only — position free, orientation held at 30 Nm/rad.
  # UR firmware handles gravity via direct_torque(); controller adds friction/coriolis.
  gravity_compensation:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      end_effector_frame: tool0
      base_frame: base_link
      task:
        k_pos_x: 0.0
        k_pos_y: 0.0
        k_pos_z: 0.0
        k_rot_x: 30.0
        k_rot_y: 30.0
        k_rot_z: 30.0
      nullspace:
        stiffness: 0.0
      use_friction: true
      use_coriolis_compensation: true
      use_local_jacobian: true
      use_gravity_compensation: false

  # Joint-space impedance: nullspace posture control only, no Cartesian task stiffness.
  # Gains scaled from UR16e by joint torque limits (150 Nm shoulder / 28 Nm wrist vs 270/54).
  # filter.dq and filter.output_torque are the primary knobs for wrist oscillation:
  #   lower alpha = more smoothing (0.1 = strong, 1.0 = no filter).
  joint_impedance_controller:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      end_effector_frame: tool0
      base_frame: base_link
      task:
        k_pos_x: 0.0
        k_pos_y: 0.0
        k_pos_z: 0.0
        k_rot_x: 0.0
        k_rot_y: 0.0
        k_rot_z: 0.0
      filter:
        dq: 0.5
        output_torque: 0.5
      max_delta_tau: 2.0      # larger rate limit avoids phase lag from excessive clamping
      nullspace:
        stiffness: 50.0
        projector_type: none
        damping: 14.0
        max_tau: 450.0
        regularization: 1.0e-06
        weights:
          shoulder_pan_joint.value:  150.0
          shoulder_lift_joint.value: 150.0
          elbow_joint.value:         150.0
          wrist_1_joint.value:        15.0  # lower weight → less torque → less wrist oscillation
          wrist_2_joint.value:        15.0
          wrist_3_joint.value:        15.0
      use_operational_space: false
      use_friction: false
      use_coriolis_compensation: true
      use_local_jacobian: true
      use_gravity_compensation: false
      limit_error: true
      limit_torques: true

  # Cartesian impedance: compliant in rotation (k_rot=0), stiff in translation.
  # k_pos scaled down from UR16e 600 N/m — UR7e has ~55% shoulder torque capacity.
  cartesian_impedance_controller:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      end_effector_frame: tool0
      base_frame: base_link
      filter:
        q: 0.5
        dq: 0.5
        output_torque: 0.5
      task:
        k_pos_x: 300.0        # UR16e: 600 → scaled by ~0.55
        k_pos_y: 300.0
        k_pos_z: 300.0
        k_rot_x: 0.0
        k_rot_y: 0.0
        k_rot_z: 0.0
      nullspace:
        stiffness: 0.0
        damping: 0.0
      use_operational_space: true
      use_friction: false
      use_coriolis_compensation: true
      use_local_jacobian: true
      use_gravity_compensation: false
      limit_torques: false

  # Raw effort passthrough — sends torques directly with no impedance computation.
  # Useful for testing and feedforward torque commands.
  forward_effort_controller:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      interface_name: effort

  freedrive_mode_controller:
    ros__parameters:
      async_wait_for_acknowledgment: true
