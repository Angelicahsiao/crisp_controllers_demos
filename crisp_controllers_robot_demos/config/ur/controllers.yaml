# Real hardware controller config for UR robots.
# use_gravity_compensation=false: UR firmware's direct_torque mode applies gravity
# automatically; enabling it in the controller would double-count.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 500  # Hz

      joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      twist_broadcaster:
        type: crisp_controllers/TwistBroadcaster

      pose_broadcaster:
        type: crisp_controllers/PoseBroadcaster

      gravity_compensation:
        type: crisp_controllers/CartesianController

      cartesian_impedance_controller:
        type: crisp_controllers/CartesianController

      joint_impedance_controller:
        type: crisp_controllers/CartesianController

      force_torque_sensor_broadcaster:
        type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

      # Robotiq 2F-140 gripper (spawned only when use_gripper:=true)
      robotiq_gripper_controller:
        type: position_controllers/GripperActionController

      robotiq_activation_controller:
        type: robotiq_controllers/RobotiqActivationController

      robotiq_joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

  joint_trajectory_controller:
    ros__parameters:
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint

  joint_state_broadcaster:
    ros__parameters:
      use_local_topics: False

  twist_broadcaster:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      end_effector_frame: tool0
      base_frame: base_link

  pose_broadcaster:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      end_effector_frame: tool0
      base_frame: base_link

  gravity_compensation:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      end_effector_frame: tool0
      base_frame: base_link

      task:
        k_pos_x: 0.0
        k_pos_y: 0.0
        k_pos_z: 0.0
        k_rot_x: 30.0
        k_rot_y: 30.0
        k_rot_z: 30.0

      nullspace:
        stiffness: 0.0

      use_friction: false
      use_coriolis_compensation: true
      use_local_jacobian: true
      use_gravity_compensation: false

  joint_impedance_controller:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      end_effector_frame: tool0
      base_frame: base_link

      task:
        k_pos_x: 0.0
        k_pos_y: 0.0
        k_pos_z: 0.0
        k_rot_x: 0.0
        k_rot_y: 0.0
        k_rot_z: 0.0

      max_delta_tau: 1.0

      nullspace:
        stiffness: 10.0
        projector_type: none
        damping: 1.5
        max_tau: 20.0
        regularization: 1.0e-06
        weights:
          shoulder_pan_joint.value:  15.0
          shoulder_lift_joint.value: 15.0
          elbow_joint.value:          8.0
          wrist_1_joint.value:        8.0
          wrist_2_joint.value:        5.0
          wrist_3_joint.value:        5.0

      use_friction: false
      use_coriolis_compensation: true
      use_local_jacobian: true
      use_gravity_compensation: false
      limit_error: true
      limit_torques: true

  cartesian_impedance_controller:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      end_effector_frame: tool0
      base_frame: base_link

      filter:
        q: 0.5
        dq: 0.5
        output_torque: 0.5

      task:
        k_pos_x: 200.0
        k_pos_y: 200.0
        k_pos_z: 200.0
        k_rot_x: 60.0
        k_rot_y: 60.0
        k_rot_z: 60.0

      nullspace:
        stiffness: 2.0

      use_friction: false
      use_coriolis_compensation: true
      use_local_jacobian: true
      use_gravity_compensation: false

  # UR built-in wrist F/T sensor (RTDE → tcp_fts_sensor state interface).
  # Publishes geometry_msgs/WrenchStamped on /force_torque_sensor_broadcaster/wrench
  force_torque_sensor_broadcaster:
    ros__parameters:
      sensor_name: tcp_fts_sensor
      state_interface_names:
        - force.x
        - force.y
        - force.z
        - torque.x
        - torque.y
        - torque.z
      frame_id: tool0
      topic_name: force_torque_sensor_broadcaster/wrench

  # Gravity compensation only — position free, orientation held at 30 Nm/rad.
  # UR firmware handles gravity via direct_torque(); controller adds friction/coriolis.
  gravity_compensation:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      end_effector_frame: tool0
      base_frame: base_link

      task:
        k_pos_x: 0.0
        k_pos_y: 0.0
        k_pos_z: 0.0
        k_rot_x: 30.0
        k_rot_y: 30.0
        k_rot_z: 30.0

      nullspace:
        stiffness: 0.0

      use_friction: false
      use_coriolis_compensation: true
      use_local_jacobian: true
      use_gravity_compensation: false

  # === Robotiq 2F-140 gripper ===
  robotiq_gripper_controller:
    ros__parameters:
      default: true
      joint: finger_joint
      allow_stalling: true

  robotiq_activation_controller:
    ros__parameters:
      default: true

  robotiq_joint_state_broadcaster:
    ros__parameters:
      joints:
        - finger_joint
      use_local_topics: true
